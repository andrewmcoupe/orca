name: Documentation
description: Report missing, confusing, or outdated docs.
title: "docs: "
labels:
  - documentation
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
  - type: input
    id: location
    attributes:
      label: Documentation location
      placeholder: "README.md, docs/events.md, release docs, etc."
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What needs to change?
      description: Describe what is missing, confusing, or incorrect.
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested wording or direction
