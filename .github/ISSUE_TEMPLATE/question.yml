name: Question
description: Ask a usage or development question.
title: "question: "
labels:
  - question
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This is not a security report.
          required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Include what you tried and what result you expected.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add version, OS, logs, screenshots, or links if relevant.
